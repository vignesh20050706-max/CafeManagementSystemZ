<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | {{ cafe_name }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --admin-primary: #7C3F2C;
            --admin-bg: #FAF9F7;
            --admin-surface: #FFFFFF;
            --admin-text: #222222;
            --admin-muted: #6B6B6B;
            --admin-border: #E8E5E1;
            --admin-danger: #C0392B;
        }
        * { box-sizing: border-box; }
        body {
            background-color: var(--admin-bg);
            color: var(--admin-text);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            background: var(--admin-surface);
            border: 1px solid var(--admin-border);
            border-radius: 10px;
            padding: 36px 32px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
        }
        .login-card .brand {
            text-align: center;
            margin-bottom: 28px;
        }
        .login-card .brand h4 {
            font-weight: 700;
            color: var(--admin-primary);
            margin-bottom: 4px;
        }
        .login-card .brand small {
            color: var(--admin-muted);
            font-size: 0.84rem;
        }
        .login-card .form-label {
            font-weight: 500;
            font-size: 0.88rem;
            color: var(--admin-text);
            margin-bottom: 4px;
        }
        .login-card .form-control {
            border-color: var(--admin-border);
            border-radius: 6px;
            padding: 9px 12px;
            font-size: 0.9rem;
        }
        .login-card .form-control:focus {
            border-color: var(--admin-primary);
            box-shadow: 0 0 0 2px rgba(124,63,44,0.15);
        }
        .btn-login {
            background-color: var(--admin-primary);
            border-color: var(--admin-primary);
            color: #fff;
            border-radius: 6px;
            padding: 9px 16px;
            font-size: 0.9rem;
            font-weight: 600;
            width: 100%;
            transition: background-color 0.15s ease;
        }
        .btn-login:hover,
        .btn-login:focus {
            background-color: #683424;
            border-color: #683424;
            color: #fff;
        }
        .alert {
            font-size: 0.86rem;
            border-radius: 6px;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="brand">
            <h4>{{ cafe_name }}</h4>
            <small>Admin Login</small>
        </div>

        {% if error %}
        <div class="alert alert-danger py-2 mb-3" role="alert">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST" action="{{ url_for('admin_routes.login') }}">
            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input type="text" class="form-control" id="username" name="username" required autofocus placeholder="Enter username">
            </div>
            <div class="mb-4">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" name="password" required placeholder="Enter password">
            </div>
            <button type="submit" class="btn btn-login">Sign In</button>
        </form>
    </div>
</body>
</html>
