{% extends "customer/base.html" %}
{% block title %}Cart - {{ cafe_name }}{% endblock %}

{% block extra_head %}
<style>
    .qty-control {
        display: inline-flex;
        align-items: center;
        border: 1.5px solid var(--primary);
        border-radius: 8px;
        overflow: hidden;
    }
    .qty-btn {
        width: 32px;
        height: 32px;
        border: none;
        background: transparent;
        color: var(--primary);
        font-size: 1.1rem;
        font-weight: 700;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0;
    }
    .qty-btn:hover { background: rgba(124,63,44,0.08); }
    .qty-val {
        width: 28px;
        text-align: center;
        font-weight: 700;
        font-size: 0.88rem;
        color: var(--primary);
    }
</style>
{% endblock %}

{% block content %}
<h1 class="h5 fw-bold mb-3">Your Cart</h1>

<!-- Cart Content (populated by JS from localStorage) -->
<div id="cart-content"></div>

<!-- Empty Cart State -->
<div id="cart-empty" class="text-center py-5">
    <div style="font-size:3rem;opacity:0.15;">&#128722;</div>
    <h2 class="h6 mt-2 mb-1">Your cart is empty</h2>
    <p class="text-muted small mb-3">Looks like you haven't added anything yet.</p>
    <a href="/menu" class="btn btn-primary px-4 py-2">Browse Menu</a>
</div>

<script src="/static/js/cart.js"></script>
{% endblock %}
